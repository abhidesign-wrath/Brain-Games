name: Build native Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'plugins/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
concurrency:
  group: native-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run verify
      - run: npm run lint
      - name: Generate native Android project from Expo config
        run: npx expo prebuild --platform android --no-install
      - name: Compile standalone test-signed APK with bundled JavaScript
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Inspect and record APK
        run: |
          python3 scripts/inspect-apk.py android/app/build/outputs/apk/release/app-release.apk artifacts
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/Mindtrail.apk > artifacts/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print artifacts/Mindtrail.apk > artifacts/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Mindtrail-APK-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
